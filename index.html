<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doppel — Estudio Creativo y Laboratorio de Tecnología</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Archivo+Narrow:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Space+Mono:wght@400;700&family=Instrument+Serif:ital@0;1&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
  html, body, #root { margin: 0; padding: 0; height: 100%; background: #0E0E0E; font-family: 'Archivo', sans-serif; }
  * { box-sizing: border-box; }
  /* Mundo de partículas three.js: fijo detrás del contenido; las secciones
     con fondo claro lo tapan, las oscuras (transparentes) lo dejan ver. */
  #fx3d { position: fixed; inset: 0; z-index: 0; pointer-events: none; display: block; }
  #root { position: relative; z-index: 1; background: transparent; }
  /* Floating WhatsApp button: hidden on desktop, shown only on mobile (see media query below) */
  .whatsapp-float { display: none !important; }
  /* Responsive fixes for small screens (iPhone) */
  @media (max-width: 720px) {
    html, body, #root { overflow-x: hidden; min-width: 100vw; }
    header { padding: 12px 16px !important; flex-wrap: wrap !important; row-gap: 14px !important; }
    header nav { display: none !important; }
    header > div, header > a, header > nav { min-width: 0 !important; }
    section { padding: 18px 16px !important; }
    .hero-grid,
    .stats-grid,
    .clients-grid,
    .work-grid,
    .why-grid,
    .where-grid,
    .pod-grid,
    .pillars-grid,
    .lab-grid,
    .apps-grid,
    .mini-features-grid,
    .reasons-grid,
    .testimonial-grid { grid-template-columns: 1fr !important; }
    .hero-grid, .pod-grid, .why-grid, .where-grid, .pillars-grid, .lab-grid, .apps-grid, .mini-features-grid, .reasons-grid, .testimonial-grid, .work-grid { gap: 20px !important; }
    .pillars-grid > div { padding: 20px 0 8px !important; border-right: none !important; }
    /* Client strip on mobile: keep the 2-row flex layout but tighten cells */
    .clients-grid > div > div { height: 56px !important; padding: 0 8px !important; }
    /* Stats: keep 3 columns compact, fix asymmetric padding/dividers */
    .stats-grid { grid-template-columns: repeat(3, 1fr) !important; gap: 0 !important; }
    .stats-grid > div { padding: 0 8px !important; text-align: center; }
    .stats-grid > div > div:first-child { font-size: clamp(28px, 8vw, 42px) !important; }
    .stats-grid > div > div:last-child { font-size: 9px !important; line-height: 1.3 !important; }
    .hero-grid h1 { font-size: clamp(28px, 11vw, 48px) !important; line-height: 1.1 !important; }
    .mid-cta { flex-direction: column !important; align-items: stretch !important; }
    .mid-cta > * { width: 100% !important; }
    .mid-cta a, .mid-cta button { width: auto !important; }
    h2 { font-size: clamp(28px, 8vw, 40px) !important; }
    h3 { font-size: clamp(22px, 7vw, 32px) !important; }
    p { max-width: 100% !important; }
    .footer-grid { display: flex !important; flex-direction: column !important; gap: 16px !important; }
    .footer-grid > div { width: 100% !important; text-align: left !important; }
    .whatsapp-float { display: block !important; position: fixed !important; right: 16px !important; bottom: 16px !important; }
  }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="variations/shared.jsx?v=40"></script>
<script type="text/babel" src="variations/funnel-landing.jsx?v=40"></script>
<script type="text/babel" src="app.jsx?v=40"></script>
<script type="module" src="fx3d.js?v=40"></script>
</body>
</html>
