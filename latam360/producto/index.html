<script>
  // Modo producto: una cápsula por filial. ?scene= elige la cápsula (Chile por defecto).
  (function () {
    var qp = new URLSearchParams(location.search);
    window.__L360_MODE = 'product';
    window.__L360_SCENE = qp.get('scene') || 'reveal';
    var CIUDAD = {
      reveal: 'Santiago',
      'lod-streaming': 'São Paulo',
      'first-person': 'Lima',
      downtown: 'Bogotá',
      'splat-portal': 'Quito'
    };
    window.__L360_VISIT_LABEL =
      window.__L360_SCENE === 'reveal'
        ? 'Visita virtual del Centro de Mantenimiento'
        : 'Visita virtual · Cápsula ' + (CIUDAD[window.__L360_SCENE] || '');
  })();
</script>
<style>
  /* Chrome de demo que NO va en el producto */
  .sidebar, .info, .topbar { display: none !important; }
  /* Controles (visita guiada / AR / sonido): bajo la navbar, al centro */
  #controls { top: 76px; bottom: auto; }

  /* Navbar LATAM (como la captura: barra flotante, logo izq., ES/PT/EN + buscar + avatar) */
  .lnav {
    position: fixed; top: 12px; left: 12px; right: 12px; z-index: 13;
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 18px; border-radius: 14px;
    background: rgba(16, 10, 36, 0.72); backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    box-shadow: 0 14px 40px rgba(5, 2, 15, 0.45);
  }
  .lnav__left { display: flex; align-items: center; gap: 13px; }
  .lnav__back {
    width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
    color: rgba(255, 255, 255, 0.75); background: rgba(255, 255, 255, 0.09);
    text-decoration: none; font-size: 15px; line-height: 1;
  }
  .lnav__back:hover { color: #fff; }
  .lnav__logo { height: 22px; filter: brightness(0) invert(1); }
  .lnav__right { display: flex; align-items: center; gap: 13px; }
  .lnav__lang { display: flex; align-items: center; gap: 3px; font: 700 12px 'Latam Sans', 'Inter', sans-serif; color: rgba(255, 255, 255, 0.6); }
  .lnav__lang .on { background: #ff4f6d; color: #fff; padding: 4px 9px; border-radius: 6px; border: none; font: inherit; cursor: pointer; }
  .lnav__lang span { padding: 4px 5px; }
  .lnav__ico {
    width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
    background: rgba(255, 255, 255, 0.1); font-size: 14px; color: #fff;
  }
  .lnav__avatar {
    width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
    background: linear-gradient(150deg, #ff4f6d, #2a0088);
    font: 700 12px 'Latam Sans', sans-serif; color: #fff; position: relative;
  }
  .lnav__avatar::after {
    content: ''; position: absolute; top: -1px; right: -1px; width: 9px; height: 9px;
    border-radius: 50%; background: #ff4f6d; border: 2px solid #140b28;
  }

  /* Tarjeta de testimonio (video embebido), como el mockup */
  .testi {
    position: fixed; right: 16px; top: 80px; z-index: 12;
    width: min(320px, calc(100vw - 32px));
    background: rgba(255, 255, 255, 0.95); border-radius: 16px; overflow: hidden;
    box-shadow: 0 22px 60px rgba(5, 2, 15, 0.5);
    transition: box-shadow 0.25s ease, transform 0.25s ease;
  }
  .testi.flash { transform: scale(1.03); box-shadow: 0 0 0 3px #ff4f6d, 0 22px 60px rgba(5, 2, 15, 0.5); }
  .testi__video { position: relative; aspect-ratio: 16 / 9; background: #000; cursor: pointer; }
  .testi__video img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0.92; }
  .testi__video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .testi__play {
    position: absolute; inset: 0; margin: auto; width: 56px; height: 56px; border-radius: 50%;
    background: #ff4f6d; border: none; cursor: pointer; color: #fff; font-size: 20px;
    display: grid; place-items: center; box-shadow: 0 10px 30px rgba(255, 79, 109, 0.55);
  }
  .testi__body { padding: 11px 14px 13px; color: #241d3a; }
  .testi__body b { font: 700 13.5px 'Latam Sans', 'Inter', sans-serif; }
  .testi__body p { margin: 3px 0 0; font: 400 11.5px 'Inter', sans-serif; color: #6a6482; }
  .testi__min {
    position: absolute; top: 8px; right: 8px; width: 24px; height: 24px; border: none; border-radius: 50%;
    background: rgba(12, 8, 28, 0.55); color: #fff; cursor: pointer; font-size: 13px; line-height: 1;
  }
  .testi.min .testi__video, .testi.min .testi__body { display: none; }
  .testi.min { width: auto; border-radius: 999px; background: rgba(255,255,255,0.92); }
  .testi.min .testi__restore { display: block; }
  .testi__restore { display: none; border: none; background: none; cursor: pointer; padding: 9px 14px; font: 700 12px 'Latam Sans', sans-serif; color: #241d3a; }

  /* Mini-mapa claro con Chile en rojo (como el mockup) */
  .minimap {
    position: fixed; left: 14px; bottom: 76px; z-index: 11;
    width: 118px; padding: 9px 9px 7px;
    background: rgba(255, 255, 255, 0.94); border-radius: 14px;
    box-shadow: 0 14px 36px rgba(5, 2, 15, 0.4);
    text-align: center;
  }
  .minimap svg { width: 100%; height: auto; display: block; }
  .minimap .countries path { fill: #e3e0ec; stroke: #c9c4da; stroke-width: 1.2; }
  .minimap .chile path { fill: #ff4f6d; stroke: none; }
  .minimap .pin { fill: #ff4f6d; stroke: #fff; stroke-width: 6; }
  .minimap span { display: block; margin-top: 5px; font: 700 10.5px 'Inter', sans-serif; color: #241d3a; }

  /* Pastillas de países con bandera (como la captura) */
  .countries-bar {
    position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 12;
    display: flex; gap: 8px; padding: 7px;
    background: rgba(12, 8, 28, 0.55); backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.14); border-radius: 999px;
    max-width: calc(100vw - 24px); overflow-x: auto; scrollbar-width: none;
  }
  .countries-bar::-webkit-scrollbar { display: none; }
  .cpill {
    display: flex; align-items: center; gap: 7px; white-space: nowrap;
    padding: 8px 15px; border-radius: 999px; border: 1px solid transparent;
    background: rgba(255, 255, 255, 0.08); color: #fff; text-decoration: none;
    font: 600 13px 'Inter', sans-serif; position: relative;
  }
  .cpill:hover { background: rgba(255, 255, 255, 0.16); }
  .cpill.on { border-color: #ff4f6d; background: rgba(255, 79, 109, 0.16); }
  .cpill.on::after { content: ''; position: absolute; left: 18px; right: 18px; bottom: -1px; height: 2px; background: #ff4f6d; border-radius: 2px; }
  .cpill.soon { opacity: 0.5; pointer-events: none; }

  /* Barra de visita guiada (sobre las pastillas) */
  .visit {
    position: fixed; left: 50%; bottom: 62px; transform: translateX(-50%);
    z-index: 11; width: min(620px, calc(100vw - 300px)); text-align: center;
  }
  .visit__track { position: relative; height: 5px; border-radius: 999px; background: rgba(255, 255, 255, 0.25); }
  .visit__fill { height: 100%; width: 0%; background: linear-gradient(90deg, #2a0088, #ff4f6d); border-radius: 999px; transition: width 0.25s linear; }
  .visit__pin {
    position: absolute; top: -9px; left: 0; width: 0; height: 0; transform: translateX(-6px);
    border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 9px solid #ff4f6d;
    transition: left 0.25s linear;
  }
  .visit__label { margin-top: 8px; font: 600 12px 'Inter', sans-serif; color: rgba(255, 255, 255, 0.9); text-shadow: 0 1px 6px rgba(0, 0, 0, 0.6); }
  .visit[hidden] { display: none; }
  @media (max-width: 760px) {
    .visit { width: calc(100vw - 160px); }
    .testi { top: auto; bottom: 120px; }
    .minimap { display: none; }
  }
</style>
<script>
(function () {
  try {
    var p = new URLSearchParams(location.search);
    if (p.has('notrack')) localStorage.setItem('l360_notrack', '1');
    if (p.has('track')) localStorage.removeItem('l360_notrack');
    if (localStorage.getItem('l360_notrack') !== '1') return;
    var BLOCK = /cloudflareinsights\.com|\/cdn-cgi\/rum/i;
    if (navigator.sendBeacon) {
      var _sb = navigator.sendBeacon.bind(navigator);
      navigator.sendBeacon = function (url) {
        try { if (BLOCK.test(String(url))) return true; } catch (e) {}
        return _sb.apply(navigator, arguments);
      };
    }
    if (window.fetch) {
      var _f = window.fetch.bind(window);
      window.fetch = function (u) {
        try {
          var s = u && u.url ? u.url : String(u);
          if (BLOCK.test(s)) return Promise.resolve(new Response('', { status: 204 }));
        } catch (e) {}
        return _f.apply(window, arguments);
      };
    }
  } catch (e) {}
})();
</script>

  <nav class="countries-bar" id="cbar">
    <a class="cpill" data-scene="reveal" href="/latam360/producto/?scene=reveal">🇨🇱 Chile</a>
    <a class="cpill" data-scene="lod-streaming" href="/latam360/producto/?scene=lod-streaming">🇧🇷 Brasil</a>
    <a class="cpill" data-scene="first-person" href="/latam360/producto/?scene=first-person">🇵🇪 Perú</a>
    <a class="cpill" data-scene="downtown" href="/latam360/producto/?scene=downtown">🇨🇴 Colombia</a>

    <span class="cpill soon">🇺🇸 USA · en captura</span>
  </nav>

  <!-- Progreso de la visita guiada -->
  <div class="visit" id="visit" hidden>
    <div class="visit__track">
      <div class="visit__fill" id="visit-fill"></div>
      <div class="visit__pin" id="visit-pin"></div>
    </div>
    <div class="visit__label" id="visit-label">Visita virtual</div>
  </div>

  <audio id="tour-audio" src="/latam360/assets/tour-music.mp3" loop preload="none"></audio>
  <audio id="tour-voice" preload="auto"></audio>
  <audio id="ambient-audio" loop preload="none"></audio>

  <div id="callout-markers"></div>
  <div id="callout" class="callout" hidden>
    <button class="callout__close" id="callout-close" aria-label="Cerrar">×</button>
    <div class="callout__media" id="callout-media"></div>
    <div class="callout__body" id="callout-body"></div>
  </div>
  <div id="callout-editor" hidden></div>

  <div id="loader">
    <img class="loader-logo" src="/latam360/assets/latam-logo.svg" alt="LATAM" />
    <div class="spinner"></div>
    <div id="loader-text">Cargando el embebido…</div>
    <div class="loader-progress"><div class="loader-progress__fill" id="loader-bar"></div></div>
    <div id="loader-pct">0%</div>
  </div>

  <script>
    // Pastilla y mini-mapa según la cápsula activa.
    (function () {
      var scene = window.__L360_SCENE;
      document.querySelectorAll('.cpill[data-scene]').forEach(function (el) {
        el.classList.toggle('on', el.dataset.scene === scene);
      });
      var PIN = {
        reveal: [195, 726, 'Santiago'],
        'lod-streaming': [546, 561, 'São Paulo'],
        'first-person': [102, 384, 'Lima'],
        downtown: [145, 138, 'Bogotá'],
        'splat-portal': [81, 209, 'Quito']
      };
      var p = PIN[scene] || PIN.reveal;
      var pin = document.getElementById('mm-pin');
      pin.setAttribute('cx', p[0]);
      pin.setAttribute('cy', p[1]);
      document.getElementById('mm-city').textContent = p[2];
      document.getElementById('mm-chile').style.display = scene === 'reveal' ? '' : 'none';

      // Testimonio: reproducir al tocar (cambia miniatura por iframe).
      var video = document.getElementById('testi-video');
      var playing = false;
      video.addEventListener('click', function () {
        if (playing) return;
        playing = true;
        video.innerHTML =
          '<iframe src="https://www.youtube.com/embed/0YZuhi6PXZ8?autoplay=1" title="Testimonio" ' +
          'allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>';
      });
      var testi = document.getElementById('testi');
      document.getElementById('testi-min').addEventListener('click', function (e) {
        e.stopPropagation();
        testi.classList.add('min');
      });
      document.getElementById('testi-restore').addEventListener('click', function () {
        testi.classList.remove('min');
      });
      // Solo el hotspot de la persona (data-testi) destaca la tarjeta de testimonio;
      // los demás puntos abren su tarjeta de información normal.
      document.getElementById('callout-markers').addEventListener(
        'click',
        function (e) {
          var hs = e.target.closest('.hotspot');
          if (!hs || hs.dataset.testi !== '1') return;
          e.stopPropagation();
          e.preventDefault();
          testi.classList.remove('min');
          testi.classList.add('flash');
          setTimeout(function () { testi.classList.remove('flash'); }, 900);
        },
        true
      );
    })();
  </script>
  <script type="module" src="/latam360/app.js?v=614c"></script>
