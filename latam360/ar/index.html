<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="robots" content="noindex, nofollow" />
<title>LATAM 360° — WebAR</title>

<!-- Motor 8th Wall (open source, MIT + binario SLAM gratuito) -->
<script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js" async crossorigin="anonymous" data-preload-chunks="slam"></script>
<script src="https://cdn.jsdelivr.net/npm/@8thwall/xrextras@1/dist/xrextras.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@8thwall/landing-page@1/dist/landing-page.js" crossorigin="anonymous"></script>

<script type="importmap">
{
  "imports": {
    "playcanvas": "https://cdn.jsdelivr.net/npm/playcanvas@2.19.6/build/playcanvas.mjs"
  }
}
</script>

<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0d0630;
    font-family: 'Inter', -apple-system, system-ui, sans-serif; }
  #camerafeed { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }

  .arbar { position: fixed; top: 0; left: 0; right: 0; z-index: 20; display: flex; align-items: center;
    justify-content: space-between; padding: calc(env(safe-area-inset-top, 0px) + 10px) 14px 10px;
    background: linear-gradient(rgba(13,6,48,.85), rgba(13,6,48,0)); pointer-events: none; }
  .arbar__left { display: flex; align-items: center; gap: 10px; }
  .arbar__logo { height: 20px; filter: brightness(0) invert(1); }
  .arbar__tag { color: #fff; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; opacity: .85; }
  .arbar a.back { pointer-events: auto; color: #fff; text-decoration: none; font-size: 20px; line-height: 1;
    padding: 4px 10px; border-radius: 8px; background: rgba(255,255,255,.14); }

  .arhint { position: fixed; left: 50%; transform: translateX(-50%); z-index: 20;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 84px);
    background: rgba(13,6,48,.78); color: #fff; font-size: 13px; padding: 9px 16px; border-radius: 999px;
    backdrop-filter: blur(6px); max-width: 82vw; text-align: center; transition: opacity .4s; }
  .arhint.off { opacity: 0; pointer-events: none; }

  .arctrl { position: fixed; left: 0; right: 0; z-index: 20; display: flex; justify-content: center; gap: 10px;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); }
  .arctrl button { border: 0; border-radius: 999px; padding: 11px 18px; font-size: 13px; font-weight: 600;
    color: #fff; background: rgba(42,0,136,.88); box-shadow: 0 4px 18px rgba(0,0,0,.35); cursor: pointer; }
  .arctrl button.alt { background: rgba(255,255,255,.16); backdrop-filter: blur(6px); }

  .artoast { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 58px); left: 50%; transform: translateX(-50%);
    z-index: 20; background: rgba(230,0,126,.92); color: #fff; font-size: 12.5px; font-weight: 600;
    padding: 8px 16px; border-radius: 999px; transition: opacity .4s; max-width: 86vw; text-align: center; }
  .artoast.off { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
  <canvas id="camerafeed"></canvas>

  <header class="arbar">
    <div class="arbar__left">
      <a class="back" href="/latam360/" title="Volver">‹</a>
      <img class="arbar__logo" src="/latam360/assets/latam-logo.svg" alt="LATAM" />
      <span class="arbar__tag">WebAR · Prototipo</span>
    </div>
  </header>

  <div class="artoast" id="toast">Preparando…</div>
  <div class="arhint" id="hint">Apunta al suelo y toca la pantalla para colocar la ciudad</div>

  <!-- Pantalla de inicio: en iOS la cámara y los sensores DEBEN pedirse desde un tap -->
  <div id="start" style="position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:linear-gradient(160deg,#0d0630,#2a0088);text-align:center;padding:24px">
    <img src="/latam360/assets/latam-logo.svg" alt="LATAM" style="height:34px;filter:brightness(0) invert(1)" />
    <p style="color:#fff;opacity:.85;font-size:14.5px;max-width:280px;margin:0">Experiencia AR: el centro histórico del demo, anclado a tu espacio real como maqueta.</p>
    <button id="btn-start" style="border:0;border-radius:999px;padding:15px 34px;font-size:16px;font-weight:700;color:#2a0088;background:#fff;box-shadow:0 8px 30px rgba(0,0,0,.4)">▶ Iniciar AR</button>
    <p style="color:#fff;opacity:.6;font-size:12px;margin:0">Se pedirá acceso a la cámara y sensores de movimiento</p>
  </div>

  <div class="arctrl">
    <button id="btn-move" class="alt" hidden>Reubicar</button>
    <button id="btn-recenter" hidden>Recentrar</button>
  </div>

<script type="module">
import * as pc from 'playcanvas'

// La ciudad del demo: downtown (Lublin) en streaming LOD/SOG — mismos assets que /latam360/demo/
const URLS = [
  'https://code.playcanvas.com/examples_data/downtown_01/ssog0/lod-meta.json',
  'https://code.playcanvas.com/examples_data/downtown_01/ssog1/lod-meta.json',
  'https://code.playcanvas.com/examples_data/downtown_01/ssog2/lod-meta.json',
  'https://code.playcanvas.com/examples_data/downtown_01/ssog3/lod-meta.json',
]
const TARGET_WIDTH = 1.6      // metros: ancho inicial de la maqueta en AR

const hint = document.getElementById('hint')
const toast = document.getElementById('toast')
const btnMove = document.getElementById('btn-move')
const btnRecenter = document.getElementById('btn-recenter')

const FLAT = new URLSearchParams(location.search).has('flat')
const setStage = (s) => { toast.textContent = s; toast.classList.remove('off') }

// Errores a la vista (para depurar en el teléfono sin consola).
window.addEventListener('error', (e) => setStage('Error: ' + (e.message || 'desconocido')))
window.addEventListener('unhandledrejection', (e) =>
  setStage('Error async: ' + (e.reason && e.reason.message || e.reason || '?')))

let model = null          // entity colocable/escalable (contiene la ciudad centrada)
let baseScale = 0.01
let pcCam = null
let placing = true
let placed = false
let cityReady = false

async function makeApp(canvas) {
  const device = await pc.createGraphicsDevice(canvas, {
    deviceTypes: ['webgl2'],   // XR8 dibuja el feed de cámara vía WebGL — no usar WebGPU aquí
    antialias: false,
  })
  const dpr = window.devicePixelRatio || 1
  device.maxPixelRatio = dpr >= 2 ? dpr * 0.5 : dpr

  const opts = new pc.AppOptions()
  opts.graphicsDevice = device
  opts.mouse = new pc.Mouse(canvas)
  opts.touch = new pc.TouchDevice(canvas)
  opts.componentSystems = [
    pc.RenderComponentSystem, pc.CameraComponentSystem, pc.LightComponentSystem,
    pc.ScriptComponentSystem, pc.GSplatComponentSystem,
  ]
  opts.resourceHandlers = [pc.TextureHandler, pc.ContainerHandler, pc.ScriptHandler, pc.GSplatHandler]

  const app = new pc.AppBase(canvas)
  app.init(opts)
  app.setCanvasFillMode(pc.FILLMODE_FILL_WINDOW)
  app.setCanvasResolution(pc.RESOLUTION_AUTO)
  window.addEventListener('resize', () => app.resizeCanvas())
  return { app, device }
}

// Carga downtown en streaming y lo deja centrado como maqueta dentro de `model`.
async function buildCity(app) {
  setStage('Cargando ciudad (streaming)…')
  const assets = URLS.map((u, i) => new pc.Asset('ssog' + i, 'gsplat', { url: u }))
  const loader = new pc.AssetListLoader(assets, app.assets)
  await new Promise((res, rej) => loader.load((e) => (e ? rej(new Error(String(e))) : res())))

  const g = app.scene.gsplat
  g.lodUpdateAngle = 90
  g.lodBehindPenalty = 3
  g.radialSorting = true
  g.lodUpdateDistance = 4
  g.lodUnderfillLimit = 5
  g.minPixelSize = 1
  g.alphaClipForward = 1 / 255
  g.minContribution = 3
  g.dataFormat = pc.GSPLATDATA_COMPACT
  g.renderer = pc.GSPLAT_RENDERER_RASTER_CPU_SORT
  g.splatBudget = 1500000

  model = new pc.Entity('model')
  const offset = new pc.Entity('offset')
  const root = new pc.Entity('city')
  root.setLocalEulerAngles(-90, 0, 0)   // misma rotación que la escena del demo
  offset.addChild(root)
  model.addChild(offset)
  app.root.addChild(model)

  let lodLevels = 1
  assets.forEach((a, i) => {
    const e = new pc.Entity('chunk' + i)
    e.addComponent('gsplat', { asset: a })
    root.addChild(e)
    lodLevels = Math.max(lodLevels, a.resource.octree?.lodLevels ?? 1)
  })

  // AABB en mundo con model en identidad → centrar XZ y apoyar el piso en y=0
  const aabb = new pc.BoundingBox()
  root.children.forEach((e, i) => {
    const b = new pc.BoundingBox()
    b.setFromTransformedAabb(assets[i].resource.aabb, e.getWorldTransform())
    i === 0 ? aabb.copy(b) : aabb.add(b)
  })
  const c = aabb.center, he = aabb.halfExtents
  offset.setLocalPosition(-c.x, -(c.y - he.y), -c.z)
  baseScale = TARGET_WIDTH / (2 * Math.max(he.x, he.z))
  model.setLocalScale(baseScale, baseScale, baseScale)
  model.enabled = FLAT   // en AR aparece recién al colocarla

  // Apertura progresiva de LOD (patrón del demo): primero los niveles gruesos
  const worst = lodLevels - 1
  g.lodRangeMin = Math.max(0, worst - 3)
  g.lodRangeMax = worst
  const sys = app.systems.gsplat
  const onReady = (cam, layer, ready, loading) => {
    if (ready && loading === 0) {
      sys.off('frame:ready', onReady)
      g.lodRangeMin = 0
      g.lodRangeMax = worst
      cityReady = true
      toast.classList.add('off')
    }
  }
  sys.on('frame:ready', onReady)
}

// ---- colocación y gestos ----
const placeFromTouch = (touch) => {
  if (!model || !pcCam) return
  const cam = pcCam.camera
  const from = cam.screenToWorld(touch.clientX, touch.clientY, cam.nearClip)
  const to = cam.screenToWorld(touch.clientX, touch.clientY, cam.farClip)
  const dir = new pc.Vec3().sub2(to, from)
  if (Math.abs(dir.y) < 1e-6) return
  const t = -from.y / dir.y
  if (t <= 0) return
  const hit = new pc.Vec3().copy(dir).mulScalar(t).add(from)
  model.setPosition(hit.x, 0.02, hit.z)
  model.enabled = true
  placed = true
  placing = false
  hint.classList.add('off')
  btnMove.hidden = false
  btnRecenter.hidden = false
}

let lastX = null, lastPinch = null, touchMoved = false, rotY = 0
const attachGestures = (canvas) => {
  canvas.addEventListener('touchstart', (e) => {
    touchMoved = false
    if (e.touches.length === 1) lastX = e.touches[0].clientX
    if (e.touches.length === 2) lastPinch = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY)
  })
  canvas.addEventListener('touchmove', (e) => {
    e.preventDefault()
    touchMoved = true
    if (!placed || !model) return
    if (e.touches.length === 1 && lastX !== null && !placing) {
      rotY += (e.touches[0].clientX - lastX) * 0.45
      model.setLocalEulerAngles(0, rotY, 0)
      lastX = e.touches[0].clientX
    } else if (e.touches.length === 2 && lastPinch !== null) {
      const p = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY)
      const s = pc.math.clamp(model.getLocalScale().x * (p / lastPinch), baseScale * 0.15, baseScale * 12)
      model.setLocalScale(s, s, s)
      lastPinch = p
    }
  }, { passive: false })
  canvas.addEventListener('touchend', (e) => {
    if (placing && !touchMoved && e.changedTouches.length === 1) placeFromTouch(e.changedTouches[0])
    lastX = null
    lastPinch = null
  })
  canvas.addEventListener('mousemove', (e) => {
    if (e.buttons === 1 && placed && model) { rotY += e.movementX * 0.45; model.setLocalEulerAngles(0, rotY, 0) }
  })
  canvas.addEventListener('click', (e) => { if (placing) placeFromTouch(e) })
}

// Estado de la cámara a la vista (para saber si iOS la pide/deniega)
const cameraStatusModule = () => ({
  name: 'latam360-camstatus',
  onCameraStatusChange: ({ status }) => {
    if (status === 'requesting') setStage('Pidiendo acceso a la cámara…')
    else if (status === 'hasStream') setStage(cityReady ? 'Cámara OK' : 'Cámara OK · cargando ciudad…')
    else if (status === 'failed') setStage('Cámara DENEGADA — habilítala en Ajustes > Apps > Safari > Cámara')
  },
})

// ---- arranque AR ----
const startAR = async () => {
  setStage('Iniciando motor…')
  const canvas = document.getElementById('camerafeed')
  const { app } = await makeApp(canvas)

  pcCam = new pc.Entity('camera')
  pcCam.addComponent('camera', {
    clearColor: new pc.Color(0, 0, 0, 0),   // transparente: detrás va el feed de la cámara
    nearClip: 0.01,
    farClip: 500,
  })
  app.root.addChild(pcCam)
  pcCam.setPosition(0, 1.6, 0)
  app.start()

  XR8.PlayCanvas.run({ pcCamera: pcCam, pcApp: app }, [
    XR8.XrController.pipelineModule(),
    LandingPage.pipelineModule(),
    XRExtras.RuntimeError.pipelineModule(),
    cameraStatusModule(),
  ], { canvas })

  attachGestures(canvas)
  buildCity(app).catch((e) => setStage('No se pudo cargar la ciudad (' + (e && e.message || e) + ')'))
}

// ---- modo visor plano (?flat=1): sin cámara ni SLAM, para aislar problemas ----
const runFlat = async () => {
  hint.textContent = 'Visor sin AR — un dedo rota, pinch escala'
  const canvas = document.getElementById('camerafeed')
  const { app } = await makeApp(canvas)
  pcCam = new pc.Entity('camera')
  pcCam.addComponent('camera', { clearColor: new pc.Color(0.05, 0.02, 0.19), nearClip: 0.01, farClip: 500 })
  app.root.addChild(pcCam)
  pcCam.setPosition(0, 1.1, 2.1)
  pcCam.lookAt(0, 0.25, 0)
  app.start()
  attachGestures(canvas)
  placed = true
  placing = false
  await buildCity(app)
  window.__ar = { app, pcCam, get model() { return model } }
}

// Watchdog: si a los 25s sigue pegado, muestra diagnóstico compacto.
setTimeout(() => {
  if (document.getElementById('start')) return
  if (toast.classList.contains('off')) return
  setStage(`Pegado en: ${toast.textContent} · XR8=${window.XR8 ? 'ok' : 'NO'} · ciudad=${cityReady ? 'ok' : 'cargando'}`)
}, 25000)

btnMove.addEventListener('click', () => {
  placing = true
  hint.textContent = 'Toca el suelo donde quieras la ciudad'
  hint.classList.remove('off')
})
btnRecenter.addEventListener('click', () => XR8.XrController.recenter())

const startEl = document.getElementById('start')
document.getElementById('btn-start').addEventListener('click', async () => {
  startEl.remove()
  setStage('Iniciando…')
  try {
    if (window.DeviceMotionEvent && typeof DeviceMotionEvent.requestPermission === 'function') {
      const p = await DeviceMotionEvent.requestPermission()
      if (p !== 'granted') setStage('Sensores de movimiento denegados — el tracking no funcionará')
    }
  } catch (e) { /* fuera de iOS el prompt no existe; seguimos */ }
  if (window.XR8) startAR()
  else {
    setStage('Cargando motor AR…')
    window.addEventListener('xrloaded', startAR)
  }
})

if (FLAT) {
  startEl.remove()
  runFlat()
}
</script>
</body>
</html>
