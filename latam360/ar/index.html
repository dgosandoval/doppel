<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="robots" content="noindex, nofollow" />
<title>LATAM 360° — WebAR</title>

<!-- Motor 8th Wall (open source, MIT + binario SLAM gratuito) -->
<script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js" async crossorigin="anonymous" data-preload-chunks="slam"></script>
<script src="https://cdn.jsdelivr.net/npm/@8thwall/xrextras@1/dist/xrextras.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@8thwall/landing-page@1/dist/landing-page.js" crossorigin="anonymous"></script>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.183.2/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.2/examples/jsm/",
    "@sparkjsdev/spark": "https://cdn.jsdelivr.net/npm/@sparkjsdev/spark@2.1.0/dist/spark.module.js"
  }
}
</script>

<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0d0630;
    font-family: 'Inter', -apple-system, system-ui, sans-serif; }
  #camerafeed { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }

  .arbar { position: fixed; top: 0; left: 0; right: 0; z-index: 20; display: flex; align-items: center;
    justify-content: space-between; padding: calc(env(safe-area-inset-top, 0px) + 10px) 14px 10px;
    background: linear-gradient(rgba(13,6,48,.85), rgba(13,6,48,0)); pointer-events: none; }
  .arbar__left { display: flex; align-items: center; gap: 10px; }
  .arbar__logo { height: 20px; filter: brightness(0) invert(1); }
  .arbar__tag { color: #fff; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; opacity: .85; }
  .arbar a.back { pointer-events: auto; color: #fff; text-decoration: none; font-size: 20px; line-height: 1;
    padding: 4px 10px; border-radius: 8px; background: rgba(255,255,255,.14); }

  .arhint { position: fixed; left: 50%; transform: translateX(-50%); z-index: 20;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 84px);
    background: rgba(13,6,48,.78); color: #fff; font-size: 13px; padding: 9px 16px; border-radius: 999px;
    backdrop-filter: blur(6px); max-width: 82vw; text-align: center; transition: opacity .4s; }
  .arhint.off { opacity: 0; pointer-events: none; }

  .arctrl { position: fixed; left: 0; right: 0; z-index: 20; display: flex; justify-content: center; gap: 10px;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); }
  .arctrl button { border: 0; border-radius: 999px; padding: 11px 18px; font-size: 13px; font-weight: 600;
    color: #fff; background: rgba(42,0,136,.88); box-shadow: 0 4px 18px rgba(0,0,0,.35); cursor: pointer; }
  .arctrl button.alt { background: rgba(255,255,255,.16); backdrop-filter: blur(6px); }

  .artoast { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 58px); left: 50%; transform: translateX(-50%);
    z-index: 20; background: rgba(230,0,126,.92); color: #fff; font-size: 12.5px; font-weight: 600;
    padding: 8px 16px; border-radius: 999px; transition: opacity .4s; }
  .artoast.off { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
  <canvas id="camerafeed"></canvas>

  <header class="arbar">
    <div class="arbar__left">
      <a class="back" href="/latam360/" title="Volver">‹</a>
      <img class="arbar__logo" src="/latam360/assets/latam-logo.svg" alt="LATAM" />
      <span class="arbar__tag">WebAR · Prototipo</span>
    </div>
  </header>

  <div class="artoast" id="toast">Cargando maqueta 3D…</div>
  <div class="arhint" id="hint">Apunta al suelo y toca la pantalla para colocar la maqueta</div>

  <div class="arctrl">
    <button id="btn-move" class="alt" hidden>Reubicar</button>
    <button id="btn-recenter" hidden>Recentrar</button>
  </div>

<script type="module">
import * as THREE from 'three'
import { SplatMesh, SparkRenderer } from '@sparkjsdev/spark'

// OJO: NO usar .spz de splat-transform@2.5.2 — escribe SPZ v4 y Spark 2.1 solo lee v1-3.
const SPLAT_URL = '/latam360/assets/splats/prueba-lite.compressed.ply'

// Geometría medida del PLY de origen (p2..p98): centro y tamaño para normalizar la maqueta.
// El splat viene con eje Y invertido (convención Brush) → giro 180° en X, igual que en el visor.
const FLIPPED_CENTER = new THREE.Vector3(-9.88, 2.16, -18.84)
const FOOTPRINT = 52          // ancho aprox. de la escena en unidades del splat
const TARGET_WIDTH = 1.6      // metros: ancho inicial de la maqueta en AR
const BASE_SCALE = TARGET_WIDTH / FOOTPRINT

const hint = document.getElementById('hint')
const toast = document.getElementById('toast')
const btnMove = document.getElementById('btn-move')
const btnRecenter = document.getElementById('btn-recenter')

let model = null          // grupo colocable (contiene el splat centrado)
let placing = true        // primer tap = colocar
let placed = false

// Errores a la vista (para depurar en el teléfono sin consola).
window.addEventListener('error', (e) => {
  toast.textContent = 'Error: ' + (e.message || 'desconocido')
  toast.classList.remove('off')
})
window.addEventListener('unhandledrejection', (e) => {
  toast.textContent = 'Error async: ' + (e.reason && e.reason.message || e.reason || '?')
  toast.classList.remove('off')
})

// ?flat=1 = visor plano sin AR (para aislar problemas de Spark vs motor 8th Wall)
const FLAT = new URLSearchParams(location.search).has('flat')

const setStage = (s) => { toast.textContent = s; toast.classList.remove('off') }
let splatState = 'sin crear'

// La descarga del splat parte DE INMEDIATO, en paralelo con el motor AR y la cámara.
// (No se usa SplatMesh({url}) directo: el gate manda no-cache y Spark no muestra progreso.)
const splatBytes = (async () => {
  const res = await fetch(SPLAT_URL)
  if (!res.ok) throw new Error('HTTP ' + res.status)
  const total = Number(res.headers.get('Content-Length')) || 3682514
  const reader = res.body.getReader()
  const chunks = []
  let got = 0
  for (;;) {
    const { done, value } = await reader.read()
    if (done) break
    chunks.push(value)
    got += value.length
    toast.textContent = `Descargando maqueta… ${Math.min(99, Math.round((got / total) * 100))}%`
  }
  const buf = new Uint8Array(got)
  let o = 0
  for (const c of chunks) { buf.set(c, o); o += c.length }
  setStage(FLAT ? 'Maqueta descargada…' : 'Maqueta descargada · esperando cámara…')
  return buf
})()
splatBytes.catch((e) => { toast.textContent = 'No se pudo descargar la maqueta (' + e.message + ')' })

const raycaster = new THREE.Raycaster()
const ground = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0)
const tmpVec = new THREE.Vector3()

// Construye el SplatMesh dentro de `model` (compartido por modo AR y modo flat).
const attachSplat = () => splatBytes.then((bytes) => {
  setStage('Construyendo maqueta…')
  splatState = 'construyendo'
  const splat = new SplatMesh({ fileBytes: bytes, fileName: 'prueba-lite.compressed.ply' })
  splat.quaternion.set(1, 0, 0, 0)                    // flip 180° X (Y-down → Y-up)
  splat.position.copy(FLIPPED_CENTER).multiplyScalar(-1)
  model.add(splat)
  setStage('Procesando splats…')
  splatState = 'procesando'
  return splat.initialized
}).then(() => {
  splatState = 'listo'
  toast.classList.add('off')
}).catch((e) => {
  splatState = 'error'
  setStage('No se pudo cargar la maqueta (' + (e && e.message || e) + ')')
})

const scenePipelineModule = () => {
  const initXrScene = ({ scene, camera, renderer }) => {
    scene.add(new SparkRenderer({ renderer }))   // requerido: sin él los SplatMesh no se pintan
    scene.add(new THREE.AmbientLight(0xffffff, 1))

    // Maqueta: splat centrado dentro de un grupo escalable.
    model = new THREE.Group()
    model.scale.setScalar(BASE_SCALE)
    model.visible = false
    scene.add(model)

    attachSplat()

    camera.position.set(0, 1.6, 0)
  }

  const placeFromTouch = (touch, { camera }) => {
    const x = (touch.clientX / window.innerWidth) * 2 - 1
    const y = -(touch.clientY / window.innerHeight) * 2 + 1
    raycaster.setFromCamera({ x, y }, camera)
    if (raycaster.ray.intersectPlane(ground, tmpVec)) {
      model.position.set(tmpVec.x, 0.02, tmpVec.z)
      model.visible = true
      placed = true
      placing = false
      hint.classList.add('off')
      btnMove.hidden = false
      btnRecenter.hidden = false
    }
  }

  // Gestos: 1 dedo = rotar (o colocar), 2 dedos = escalar (pinch).
  let lastX = null
  let lastPinch = null
  let touchMoved = false

  const onTouchStart = (e) => {
    touchMoved = false
    if (e.touches.length === 1) lastX = e.touches[0].clientX
    if (e.touches.length === 2) {
      const dx = e.touches[0].clientX - e.touches[1].clientX
      const dy = e.touches[0].clientY - e.touches[1].clientY
      lastPinch = Math.hypot(dx, dy)
    }
  }
  const onTouchMove = (e) => {
    e.preventDefault()
    touchMoved = true
    if (!placed) return
    if (e.touches.length === 1 && lastX !== null && !placing) {
      const x = e.touches[0].clientX
      model.rotation.y += (x - lastX) * 0.008
      lastX = x
    } else if (e.touches.length === 2 && lastPinch !== null) {
      const dx = e.touches[0].clientX - e.touches[1].clientX
      const dy = e.touches[0].clientY - e.touches[1].clientY
      const pinch = Math.hypot(dx, dy)
      const s = THREE.MathUtils.clamp(model.scale.x * (pinch / lastPinch), BASE_SCALE * 0.15, BASE_SCALE * 12)
      model.scale.setScalar(s)
      lastPinch = pinch
    }
  }
  const onTouchEnd = (e) => {
    if (placing && !touchMoved && e.changedTouches.length === 1) {
      placeFromTouch(e.changedTouches[0], XR8.Threejs.xrScene())
    }
    lastX = null
    lastPinch = null
  }

  return {
    name: 'latam360-ar',
    onStart: ({ canvas }) => {
      const { scene, camera, renderer } = XR8.Threejs.xrScene()
      initXrScene({ scene, camera, renderer })

      canvas.addEventListener('touchstart', onTouchStart)
      canvas.addEventListener('touchmove', onTouchMove, { passive: false })
      canvas.addEventListener('touchend', onTouchEnd)

      XR8.XrController.updateCameraProjectionMatrix({
        origin: camera.position,
        facing: camera.quaternion,
      })
    },
  }
}

btnMove.addEventListener('click', () => {
  placing = true
  hint.textContent = 'Toca el suelo donde quieras la maqueta'
  hint.classList.remove('off')
})
btnRecenter.addEventListener('click', () => {
  XR8.XrController.recenter()
})

const onxrloaded = () => {
  XR8.addCameraPipelineModules([
    XR8.GlTextureRenderer.pipelineModule(),
    XR8.Threejs.pipelineModule(),
    XR8.XrController.pipelineModule(),
    LandingPage.pipelineModule(),
    XRExtras.FullWindowCanvas.pipelineModule(),
    XRExtras.Loading.pipelineModule(),
    XRExtras.RuntimeError.pipelineModule(),
    scenePipelineModule(),
  ])
  XR8.run({ canvas: document.getElementById('camerafeed') })
}

// Modo visor plano (?flat=1): three.js puro, sin cámara ni SLAM — aísla Spark del motor AR.
const runFlat = async () => {
  hint.textContent = 'Visor sin AR — un dedo rota, pinch escala'
  const canvas = document.getElementById('camerafeed')
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: false })
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2))
  const scene = new THREE.Scene()
  scene.background = new THREE.Color(0x0d0630)
  const camera = new THREE.PerspectiveCamera(60, 1, 0.01, 100)
  camera.position.set(0, 1.1, 2.1)
  camera.lookAt(0, 0.25, 0)
  const resize = () => {
    renderer.setSize(window.innerWidth, window.innerHeight)
    camera.aspect = window.innerWidth / window.innerHeight
    camera.updateProjectionMatrix()
  }
  resize()
  window.addEventListener('resize', resize)

  scene.add(new SparkRenderer({ renderer }))
  model = new THREE.Group()
  model.scale.setScalar(BASE_SCALE)
  scene.add(model)
  placed = true
  placing = false

  // Gestos básicos del visor plano
  let lastX = null, lastPinch = null
  canvas.addEventListener('touchstart', (e) => {
    if (e.touches.length === 1) lastX = e.touches[0].clientX
    if (e.touches.length === 2) lastPinch = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY)
  })
  canvas.addEventListener('touchmove', (e) => {
    e.preventDefault()
    if (e.touches.length === 1 && lastX !== null) {
      model.rotation.y += (e.touches[0].clientX - lastX) * 0.008
      lastX = e.touches[0].clientX
    } else if (e.touches.length === 2 && lastPinch !== null) {
      const p = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY)
      model.scale.setScalar(THREE.MathUtils.clamp(model.scale.x * (p / lastPinch), BASE_SCALE * 0.15, BASE_SCALE * 12))
      lastPinch = p
    }
  }, { passive: false })
  canvas.addEventListener('touchend', () => { lastX = null; lastPinch = null })
  canvas.addEventListener('mousemove', (e) => { if (e.buttons === 1) model.rotation.y += e.movementX * 0.008 })

  await attachSplat()
  renderer.setAnimationLoop(() => renderer.render(scene, camera))
  window.__ar = { renderer, scene, camera, model }
}

// Watchdog: si a los 18s la carga sigue pegada, muestra diagnóstico compacto.
setTimeout(() => {
  if (toast.classList.contains('off') || splatState === 'error') return
  let gl2 = '?'
  try {
    const xr3 = !FLAT && window.XR8 && XR8.Threejs.xrScene()
    if (xr3 && xr3.renderer) gl2 = xr3.renderer.getContext() instanceof WebGL2RenderingContext ? 'sí' : 'NO'
  } catch (e) {}
  setStage(`Pegado en: ${toast.textContent} · splat=${splatState} · XR8=${window.XR8 ? 'ok' : 'NO'} · gl2=${gl2}`)
}, 18000)

if (FLAT) {
  runFlat()
} else {
  window.XR8 ? onxrloaded() : window.addEventListener('xrloaded', onxrloaded)
}
</script>
</body>
</html>
