<script type="importmap">
{
  "imports": {
    "playcanvas": "https://cdn.jsdelivr.net/npm/playcanvas@2.19.6/build/playcanvas.mjs",
    "examples/context": "/latam360/lib/context.mjs",

<!-- Cloudflare Web Analytics está activo vía la integración automática de Pages
     (cuenta las visitas solo). Este script NO inyecta beacon; solo EXCLUYE TUS
     visitas: en cada dispositivo/navegador donde visites .../?notrack=1, silencia
     el envío del beacon de Cloudflare (deja de contarte). ?track=1 lo revierte. -->
<script>
(function () {
  try {
    var p = new URLSearchParams(location.search);
    if (p.has('notrack')) localStorage.setItem('l360_notrack', '1');
    if (p.has('track')) localStorage.removeItem('l360_notrack');
    if (localStorage.getItem('l360_notrack') !== '1') return; // visitante normal: contar
    // Tus dispositivos: bloquear el envío de red del beacon de Cloudflare Analytics.
    var BLOCK = /cloudflareinsights\.com|\/cdn-cgi\/rum/i;
    if (navigator.sendBeacon) {
      var _sb = navigator.sendBeacon.bind(navigator);
      navigator.sendBeacon = function (url) {
        try { if (BLOCK.test(String(url))) return true; } catch (e) {}
        return _sb.apply(navigator, arguments);
      };
    }
    if (window.fetch) {
      var _f = window.fetch.bind(window);
      window.fetch = function (u) {
        try {
          var s = u && u.url ? u.url : String(u);
          if (BLOCK.test(s)) return Promise.resolve(new Response('', { status: 204 }));
        } catch (e) {}
        return _f.apply(window, arguments);
      };
    }
  } catch (e) {}
})();
</script>
</head>
<body>
  <canvas id="application-canvas"></canvas>

  <!-- Top bar -->
  <div class="topbar">
    <div class="brand">
      <img class="brand__logo" src="assets/latam-logo.svg" alt="LATAM" />
      <span class="brand__divider"></span>
      <span class="brand__title">360<sup>°</sup> EXPERIENCE</span>
    </div>
    <div class="topbar__right">
      <span class="topbar__pre">Demo ·</span>
      <img class="topbar__doppel" src="assets/doppel-logo.png" alt="Doppel" />
    </div>
  </div>

  <!-- Selector de escenas -->
  <nav class="sidebar">
    <p class="sidebar__label">Experiencias</p>
    <div id="scenes"></div>
  </nav>

  <!-- Panel de información -->
  <aside class="info">
    <div class="info__place" id="info-place"></div>
    <h2 class="info__name" id="info-name"></h2>
    <p class="info__desc" id="info-desc"></p>
    <div class="info__credit" id="info-credit"></div>
  </aside>

  <!-- Hint de controles -->
  <div class="hint" id="hint"></div>

  <!-- Botón de recorrido automático (visible solo en escenas con tour) -->
  <button class="tour-btn" id="tour-btn" hidden>
    <span class="tour-btn__icon">▶</span>
    <span class="tour-btn__label">Iniciar recorrido</span>
  </button>

  <!-- Botón de vista AR por giroscopio (solo mobile con sensores) -->
  <button class="gyro-btn" id="gyro-btn" hidden>
    <span class="gyro-btn__icon">◎</span>
    <span class="gyro-btn__label">Vista AR</span>
  </button>

  <!-- Tarjeta de mensajes que aparece durante el recorrido -->
  <div class="tour-caption" id="tour-caption"></div>

  <!-- Música del recorrido (opcional: coloca tu pista en assets/tour-music.mp3) -->
  <audio id="tour-audio" src="assets/tour-music.mp3" loop preload="none"></audio>

  <!-- Locución del recorrido (un clip por escena, en assets/voice/) -->
  <audio id="tour-voice" preload="auto"></audio>

  <!-- Marca de versión / diagnóstico: barra superior, estilos inline (se ve aunque
       el CSS/JS estén en caché vieja). Un script inline captura errores de app.js
       y los muestra aquí, para ver POR QUÉ no arranca si falla. -->
  <div id="build-tag" style="position:fixed;top:0;left:0;right:0;bottom:auto;height:auto;z-index:2147483647;text-align:center;font:bold 12px/1.6 ui-monospace,monospace;color:#fff;background:#c0264a;padding:6px 8px;word-break:break-word;">613h·html</div>
  <script>
    (function () {
      var set = function (s) { var b = document.getElementById('build-tag'); if (b) b.textContent = s; };
      window.__l360diag = set;
      window.addEventListener('error', function (e) {
        set('ERR: ' + (e.message || e) + ' @ ' + String(e.filename || '').split('/').pop() + ':' + (e.lineno || ''));
      });
      window.addEventListener('unhandledrejection', function (e) {
        set('REJ: ' + ((e.reason && (e.reason.message || e.reason)) || 'promise'));
      });
      var t = navigator.maxTouchPoints > 0 ? 1 : 0;
      var o = typeof window.DeviceOrientationEvent !== 'undefined' ? 1 : 0;
      set('613h · inlineJS ok · touch:' + t + ' · orient:' + o + ' · cargando app.js…');
    })();
  </script>

  <!-- Loader -->
  <div id="loader">
    <img class="loader-logo" src="assets/latam-logo.svg" alt="LATAM" />
    <div class="spinner"></div>
    <div id="loader-text">Iniciando experiencia inmersiva…</div>
    <div class="loader-progress"><div class="loader-progress__fill" id="loader-bar"></div></div>
    <div id="loader-pct">0%</div>
  </div>

  <script type="module" src="app.js?v=613h"></script>
</body>
</html>
