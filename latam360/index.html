<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="robots" content="noindex, nofollow" />
<title>LATAM 360° — Experiencia inmersiva</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="preconnect" href="https://code.playcanvas.com" crossorigin />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
<script type="importmap">
{
  "imports": {
    "playcanvas": "https://cdn.jsdelivr.net/npm/playcanvas@2.19.6/build/playcanvas.mjs",
    "examples/context": "/latam360/lib/context.mjs",
    "playcanvas/scripts/esm/camera-controls.mjs": "https://cdn.jsdelivr.net/npm/playcanvas@2.19.6/scripts/esm/camera-controls.mjs",
    "playcanvas/scripts/esm/first-person-controller.mjs": "https://cdn.jsdelivr.net/npm/playcanvas@2.19.6/scripts/esm/first-person-controller.mjs",
    "playcanvas/scripts/esm/gsplat/reveal-radial.mjs": "https://cdn.jsdelivr.net/npm/playcanvas@2.19.6/scripts/esm/gsplat/reveal-radial.mjs",
    "playcanvas/scripts/esm/gsplat/reveal-rain.mjs": "https://cdn.jsdelivr.net/npm/playcanvas@2.19.6/scripts/esm/gsplat/reveal-rain.mjs",
    "playcanvas/scripts/esm/gsplat/reveal-grid-eruption.mjs": "https://cdn.jsdelivr.net/npm/playcanvas@2.19.6/scripts/esm/gsplat/reveal-grid-eruption.mjs",
    "playcanvas/scripts/esm/gsplat/gsplat-weather.mjs": "https://cdn.jsdelivr.net/npm/playcanvas@2.19.6/scripts/esm/gsplat/gsplat-weather.mjs"
  }
}
</script>

<!-- Analytics: Cloudflare Web Analytics, con exclusión de TUS visitas.
     1) Pega tu token del beacon en CF_BEACON_TOKEN (Cloudflare → Web Analytics → Add a site).
     2) En cada uno de tus dispositivos/navegadores, visita una vez:
        https://doppel.cl/latam360/?notrack=1   (deja de contarte; ?track=1 lo revierte) -->
<script>
(function () {
  var CF_BEACON_TOKEN = 'PEGAR_TOKEN_AQUI';
  try {
    var p = new URLSearchParams(location.search);
    if (p.has('notrack')) localStorage.setItem('l360_notrack', '1');
    if (p.has('track')) localStorage.removeItem('l360_notrack');
    if (localStorage.getItem('l360_notrack') === '1') return; // tus dispositivos: no contar
    if (!CF_BEACON_TOKEN || CF_BEACON_TOKEN.indexOf('PEGAR') === 0) return; // sin token aún: no inyectar
    var s = document.createElement('script');
    s.defer = true;
    s.src = 'https://static.cloudflareinsights.com/beacon.min.js';
    s.setAttribute('data-cf-beacon', JSON.stringify({ token: CF_BEACON_TOKEN }));
    document.head.appendChild(s);
  } catch (e) {}
})();
</script>
</head>
<body>
  <canvas id="application-canvas"></canvas>

  <!-- Top bar -->
  <div class="topbar">
    <div class="brand">
      <img class="brand__logo" src="assets/latam-logo.svg" alt="LATAM" />
      <span class="brand__divider"></span>
      <span class="brand__title">360<sup>°</sup> EXPERIENCE</span>
    </div>
    <div class="topbar__right">
      <span class="topbar__pre">Demo ·</span>
      <img class="topbar__doppel" src="assets/doppel-logo.png" alt="Doppel" />
    </div>
  </div>

  <!-- Selector de escenas -->
  <nav class="sidebar">
    <p class="sidebar__label">Experiencias</p>
    <div id="scenes"></div>
  </nav>

  <!-- Panel de información -->
  <aside class="info">
    <div class="info__place" id="info-place"></div>
    <h2 class="info__name" id="info-name"></h2>
    <p class="info__desc" id="info-desc"></p>
    <div class="info__credit" id="info-credit"></div>
  </aside>

  <!-- Hint de controles -->
  <div class="hint" id="hint"></div>

  <!-- Botón de recorrido automático (visible solo en escenas con tour) -->
  <button class="tour-btn" id="tour-btn" hidden>
    <span class="tour-btn__icon">▶</span>
    <span class="tour-btn__label">Iniciar recorrido</span>
  </button>

  <!-- Botón de vista AR por giroscopio (solo mobile con sensores) -->
  <button class="gyro-btn" id="gyro-btn" hidden>
    <span class="gyro-btn__icon">◎</span>
    <span class="gyro-btn__label">Vista AR</span>
  </button>

  <!-- Tarjeta de mensajes que aparece durante el recorrido -->
  <div class="tour-caption" id="tour-caption"></div>

  <!-- Música del recorrido (opcional: coloca tu pista en assets/tour-music.mp3) -->
  <audio id="tour-audio" src="assets/tour-music.mp3" loop preload="none"></audio>

  <!-- Locución del recorrido (un clip por escena, en assets/voice/) -->
  <audio id="tour-voice" preload="auto"></audio>

  <!-- Loader -->
  <div id="loader">
    <img class="loader-logo" src="assets/latam-logo.svg" alt="LATAM" />
    <div class="spinner"></div>
    <div id="loader-text">Iniciando experiencia inmersiva…</div>
    <div class="loader-progress"><div class="loader-progress__fill" id="loader-bar"></div></div>
    <div id="loader-pct">0%</div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
